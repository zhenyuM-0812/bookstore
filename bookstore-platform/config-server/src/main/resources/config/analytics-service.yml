spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/analytics_service_db
    driver-class-name: org.postgresql.Driver
    username: bookstore_user
    password: bookstore_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": com.example.analytics.event.OrderPlacedEvent
        "[spring.json.trusted.packages]": com.example.analytics.event

app:
  kafka:
    topics:
      order-placed: order-placed
