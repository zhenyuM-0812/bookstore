spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_service_db
    driver-class-name: org.postgresql.Driver
    username: bookstore_user
    password: bookstore_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          book-service:
            connectTimeout: 2000
            readTimeout: 3000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": com.example.order.event.PaymentCompletedEvent
        "[spring.json.trusted.packages]": com.example.order.event

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false


server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:Ym9va3N0b3JlLWRldi1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}

clients:
  book-service:
    url: http://localhost:8082

resilience4j:
  circuitbreaker:
    instances:
      bookService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - "feign.FeignException$Conflict"

app:
  kafka:
    topics:
      payment-completed: payment-completed
      order-placed: order-placed




